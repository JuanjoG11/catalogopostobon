<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Catálogo Postobón</title>
  <script src="assets/js/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f13; color: #e0e0e0; min-height: 100vh; }
    header { background: #1a1a24; border-bottom: 1px solid #2a2a3a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header p  { font-size: 12px; color: #555; margin-top: 2px; }
    .btn-cat { background: #6c63ff; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .toolbar { padding: 12px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #13131c; border-bottom: 1px solid #1e1e2e; }
    .search-box { flex: 1; min-width: 200px; background: #1e1e2e; border: 1px solid #2a2a3a; border-radius: 8px; padding: 8px 14px; color: #e0e0e0; font-size: 14px; outline: none; }
    .search-box:focus { border-color: #6c63ff; }
    .filter-cat { background: #1e1e2e; border: 1px solid #2a2a3a; border-radius: 8px; padding: 8px 12px; color: #e0e0e0; font-size: 13px; outline: none; cursor: pointer; }
    .fbtn { padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
    .fbtn.all { background: #2a2a3a; color: #ccc; border-color: #3a3a4a; }
    .fbtn.sin { background: #2a1515; color: #ff6b6b; border-color: #5a2020; }
    .fbtn.con { background: #152a15; color: #6bff6b; border-color: #205a20; }
    .fbtn.eli { background: #2a1a0a; color: #ffaa44; border-color: #5a3a10; }
    .fbtn.active { outline: 2px solid #6c63ff; outline-offset: 2px; }
    .stats { padding: 8px 24px; font-size: 12px; color: #555; background: #0f0f13; border-bottom: 1px solid #1a1a24; }
    .stats strong { color: #888; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; padding: 18px 24px; }
    .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
    .card:hover { border-color: #6c63ff; }
    .card.sin-foto { border-color: #3a1e1e; }
    .card.eliminado { opacity: 0.5; border-color: #3a2a1a; }
    .card-img { width: 100%; height: 130px; background: #13131c; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .card-img img { max-height: 120px; max-width: 100%; object-fit: contain; }
    .placeholder { font-size: 44px; opacity: 0.2; }
    .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
    .badge.ok  { background: #1d7a40; color: #a0ffbf; }
    .badge.bad { background: #7a1d1d; color: #ffaaaa; }
    .badge.eli { background: #5a3a10; color: #ffaa44; }
    .card-body { padding: 10px 12px; }
    .card-nombre { font-size: 12px; font-weight: 700; color: #e0e0e0; margin-bottom: 2px; line-height: 1.3; cursor: pointer; }
    .card-nombre:hover { color: #a09aff; }
    .nombre-input { width: 100%; background: #0f0f13; border: 1px solid #6c63ff; border-radius: 6px; padding: 5px 8px; color: #fff; font-size: 12px; font-weight: 700; outline: none; margin-bottom: 4px; }
    .card-sub { font-size: 11px; color: #aaaacc; margin-bottom: 8px; font-weight: 500; }
    .upload-zone { border: 2px dashed #2a2a3a; border-radius: 8px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; background: #13131c; }
    .upload-zone:hover, .upload-zone.over { border-color: #6c63ff; background: #1c1c2e; }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .uz-icon { font-size: 20px; margin-bottom: 2px; pointer-events: none; }
    .uz-text { font-size: 11px; color: #555; pointer-events: none; }
    .preview-wrap { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .preview-wrap img { height: 48px; border-radius: 6px; object-fit: contain; }
    .preview-wrap span { font-size: 10px; color: #888; word-break: break-all; }
    .btn-save { width: 100%; margin-top: 8px; padding: 9px; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: none; align-items: center; justify-content: center; gap: 6px; }
    .btn-save:hover:not(:disabled) { background: #5248d0; }
    .btn-save.show { display: flex; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-quitar { width: 100%; margin-top: 5px; padding: 6px; background: transparent; color: #555; border: 1px solid #2a2a3a; border-radius: 8px; font-size: 11px; cursor: pointer; transition: all 0.2s; display: none; }
    .btn-quitar:hover { color: #ff6b6b; border-color: #ff6b6b; }
    .btn-quitar.show { display: block; }
    .btn-eliminar { width: 100%; margin-top: 5px; padding: 7px; background: #2a1010; color: #ff6b6b; border: 1px solid #5a2020; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-eliminar:hover { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
    .progress-bar { height: 3px; background: #2a2a3a; border-radius: 3px; margin-top: 6px; overflow: hidden; display: none; }
    .progress-bar.show { display: block; }
    .progress-fill { height: 100%; background: #6c63ff; transition: width 0.2s; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1d7a40; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; opacity: 0; transform: translateY(8px); transition: all 0.3s; z-index: 999; pointer-events: none; max-width: 320px; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #7a1d1d; }
    .empty { grid-column: 1/-1; text-align: center; padding: 60px; color: #333; font-size: 15px; }
    .loading { position: fixed; inset: 0; background: #0f0f13; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 300; }
    .loading .big-spin { width: 44px; height: 44px; border: 3px solid #2a2a3a; border-top-color: #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading p { color: #555; font-size: 14px; }

    /* BOTÓN AGREGAR PRODUCTO */
    .btn-add { background: #1d7a40; color: #a0ffbf; border: 1px solid #205a20; font-weight: 800; font-size: 13px; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .btn-add:hover { background: #25a050; color: #fff; }

    /* MODAL AGREGAR PRODUCTO */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); z-index: 500; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; opacity: 0; pointer-events: none; transition: opacity 0.25s; overflow-y: auto; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-form { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 16px; width: 100%; max-width: 580px; transform: translateY(18px); transition: transform 0.25s; }
    .modal-overlay.open .modal-form { transform: translateY(0); }
    .mf-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #2a2a3a; }
    .mf-header h2 { font-size: 17px; font-weight: 800; color: #fff; }
    .mf-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2a2a3a; background: transparent; color: #888; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .mf-close:hover { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
    .mf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px 22px; }
    .mf-field { display: flex; flex-direction: column; gap: 5px; }
    .mf-field.mf-col2 { grid-column: 1/-1; }
    .mf-field label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .mf-field label .req { color: #ff6b6b; }
    .mf-field input, .mf-field select { background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 8px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.15s; }
    .mf-field input:focus, .mf-field select:focus { border-color: #6c63ff; }
    .mf-field input::placeholder { color: #444; }
    .mf-actions { display: flex; gap: 10px; padding: 0 22px 14px; justify-content: flex-end; }
    .mf-btn-cancel { padding: 10px 20px; border-radius: 8px; border: 1px solid #2a2a3a; background: transparent; color: #aaa; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .mf-btn-cancel:hover { background: #1e1e2e; color: #fff; }
    .mf-btn-save { padding: 10px 22px; border-radius: 8px; border: none; background: #6c63ff; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .mf-btn-save:hover { background: #5248d0; }
    .mf-btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .mf-hint { padding: 0 22px 18px; font-size: 11px; color: #555; text-align: center; }
    @media (max-width: 520px) { .mf-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <div class="big-spin"></div>
  <p>Cargando datos desde Supabase...</p>
</div>

<header>
  <div>
    <h1>🛠 Admin — Catálogo Postobón</h1>
    <p>Fotos, nombres y eliminados se guardan en Supabase — visibles en cualquier dispositivo</p>
  </div>
  <a href="index.html" target="_blank" class="btn-cat">Ver catálogo →</a>
</header>

<div class="toolbar">
  <button class="btn-add" onclick="abrirFormProducto()">➕ Agregar producto</button>
  <input class="search-box" type="search" id="search" placeholder="🔍  Buscar producto, marca, código...">
  <select class="filter-cat" id="filter-cat"><option value="">Todas las categorías</option></select>
  <button class="fbtn all active" onclick="setFiltro(this,'all')">Todos</button>
  <button class="fbtn sin"        onclick="setFiltro(this,'sin')">❌ Sin foto</button>
  <button class="fbtn con"        onclick="setFiltro(this,'con')">✅ Con foto</button>
  <button class="fbtn eli"        onclick="setFiltro(this,'eli')">🗑 Eliminados</button>
</div>

<div class="stats" id="stats"></div>
<div class="grid"  id="grid"></div>
<!-- MODAL AGREGAR PRODUCTO -->
<div class="modal-overlay" id="form-producto">
  <div class="modal-form">
    <div class="mf-header">
      <h2>➕ Agregar producto</h2>
      <button class="mf-close" onclick="cerrarFormProducto()" aria-label="Cerrar">✕</button>
    </div>
    <form id="np-form" onsubmit="event.preventDefault(); guardarProducto()">
      <div class="mf-grid">
        <div class="mf-field mf-col2">
          <label>Nombre <span class="req">*</span></label>
          <input type="text" id="np-nombre" required placeholder="Ej: NARANJA POSTOBON">
        </div>
        <div class="mf-field">
          <label>Marca <span class="req">*</span></label>
          <input type="text" id="np-marca" list="np-marcas-list" required placeholder="Ej: POSTOBON">
          <datalist id="np-marcas-list"></datalist>
        </div>
        <div class="mf-field">
          <label>Categoría <span class="req">*</span></label>
          <select id="np-categoria" required></select>
        </div>
        <div class="mf-field">
          <label>Sabor</label>
          <input type="text" id="np-sabor" placeholder="Ej: Naranja">
        </div>
        <div class="mf-field">
          <label>Embalaje <span class="req">*</span></label>
          <select id="np-embalaje" required></select>
        </div>
        <div class="mf-field">
          <label>Presentación</label>
          <input type="text" id="np-presentacion" placeholder="Ej: 400 ML PET X 15">
        </div>
        <div class="mf-field">
          <label>Volumen</label>
          <input type="text" id="np-volumen" placeholder="Ej: 400ml">
        </div>
        <div class="mf-field">
          <label>Unidades por paca</label>
          <input type="number" id="np-unidades" min="1" placeholder="15">
        </div>
        <div class="mf-field">
          <label>Precio por paca (COP)</label>
          <input type="number" id="np-precio" min="0" placeholder="31250">
        </div>
        <div class="mf-field">
          <label>Peso unitario (kg)</label>
          <input type="number" id="np-peso" step="0.001" min="0" placeholder="0.422">
        </div>
        <div class="mf-field mf-col2">
          <label>Código de barras</label>
          <input type="text" id="np-codigo" placeholder="7702090...">
        </div>
      </div>
      <div class="mf-actions">
        <button type="button" class="mf-btn-cancel" onclick="cerrarFormProducto()">Cancelar</button>
        <button type="submit" class="mf-btn-save" id="np-btn-save">💾 Guardar producto</button>
      </div>
    </form>
    <p class="mf-hint">Podrás subir la foto desde la tarjeta del producto una vez creado.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/productos.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════════
// SUPABASE
// ══════════════════════════════════════════════════════════════════════════════
const SUPA_URL  = 'https://ahcvjqrlggmfmyevgjqb.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY3ZqcXJsZ2dtZm15ZXZnanFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDk1NDUsImV4cCI6MjEwOTM4NTU0NX0.S2i3UO9yCw-WQzmwi8Q_Fs_a3nyMQz0-IWeu_uVnG1s';
const BUCKET    = 'productos';
const sb        = supabase.createClient(SUPA_URL, SUPA_ANON);

// ══════════════════════════════════════════════════════════════════════════════
// ESTADO GLOBAL — todo viene de Supabase, nada de localStorage
// ══════════════════════════════════════════════════════════════════════════════
let imgMap    = {};   // { id: "ext" }  — fotos subidas
let nombresMap = {};  // { id: "nombre personalizado" }
let eliminados = [];  // [id, id, ...]
let pending   = {};   // { id: { dataUrl, file } }
let filtroActivo = 'all';
let productosCustom = [];  // productos creados desde el admin
let nextCustomId    = 90001;  // próximo ID para productos personalizados

const CAT_ICON = { GASEOSA:'🥤', JUGOS:'🍊', HIDRATANTES:'💧', ENERGIZANTES:'⚡', AGUAS:'🫧', 'BEBIDA DE TE':'🍵', CERVEZA:'🍺', ALIMENTOS:'🛒', 'CAFÉ':'☕' };

// ══════════════════════════════════════════════════════════════════════════════
// CARGAR TODO DESDE SUPABASE
// ══════════════════════════════════════════════════════════════════════════════
async function cargarTodo() {
  // 1. Fotos del bucket
  const { data: archivos } = await sb.storage.from(BUCKET).list('', { limit: 1000 });
  imgMap = {};
  (archivos || []).forEach(f => {
    const m = f.name.match(/^img_(\d+)\.(\w+)$/);
    if (m) imgMap[parseInt(m[1])] = m[2];
  });

  // 2. Nombres, eliminados y productos personalizados de la tabla catalogo_config
  const { data: cfg } = await sb.from('catalogo_config').select('clave, valor');
  nombresMap = {};
  eliminados = [];
  productosCustom = [];
  nextCustomId = 90001;
  (cfg || []).forEach(row => {
    if (row.clave === 'nombres')          nombresMap      = row.valor || {};
    if (row.clave === 'eliminados')       eliminados      = row.valor || [];
    if (row.clave === 'productos_custom') productosCustom = row.valor || [];
    if (row.clave === 'productos_next_id') nextCustomId   = row.valor || 90001;
  });

  // 3. Fusionar productos personalizados al array global
  productosCustom.forEach(p => {
    if (!productos.find(x => x.id === p.id)) productos.push(p);
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// GUARDAR EN SUPABASE
// ══════════════════════════════════════════════════════════════════════════════
async function guardarNombresDB() {
  await sb.from('catalogo_config').upsert({ clave: 'nombres', valor: nombresMap, updated_at: new Date().toISOString() });
}
async function guardarEliminadosDB() {
  await sb.from('catalogo_config').upsert({ clave: 'eliminados', valor: eliminados, updated_at: new Date().toISOString() });
}
async function guardarProductosCustomDB() {
  await sb.from('catalogo_config').upsert({ clave: 'productos_custom', valor: productosCustom, updated_at: new Date().toISOString() });
}
async function guardarNextIdDB() {
  await sb.from('catalogo_config').upsert({ clave: 'productos_next_id', valor: nextCustomId, updated_at: new Date().toISOString() });
}

// ══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════════════
const getImgUrl   = id  => imgMap[id] ? `${SUPA_URL}/storage/v1/object/public/${BUCKET}/img_${id}.${imgMap[id]}` : null;
const getNombre   = p   => nombresMap[p.id] || p.nombre;
const estaEliminado = id => eliminados.includes(id);
const tieneFoto   = p   => !!(getImgUrl(p.id) || p.imagen);

function getImgSrc(p) {
  const url = getImgUrl(p.id);
  if (url) return url;
  if (p.imagen) return `assets/img/productos/${p.imagen}`;
  return null;
}

// ══════════════════════════════════════════════════════════════════════════════
// FILTROS Y RENDER
// ══════════════════════════════════════════════════════════════════════════════
function setFiltro(btn, f) {
  filtroActivo = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filtrar() {
  const q   = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.getElementById('filter-cat').value;
  return productos.filter(p => {
    const eli = estaEliminado(p.id);
    if (filtroActivo === 'eli' && !eli) return false;
    if (filtroActivo !== 'eli' &&  eli) return false;
    if (cat && p.categoria !== cat) return false;
    if (filtroActivo === 'sin' &&  tieneFoto(p)) return false;
    if (filtroActivo === 'con' && !tieneFoto(p)) return false;
    if (!q) return true;
    return p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q) ||
           p.sabor.toLowerCase().includes(q)  || String(p.id).includes(q) ||
           p.presentacion.toLowerCase().includes(q);
  });
}

function render() {
  const lista    = filtrar();
  const total    = productos.length;
  const nEli     = eliminados.length;
  const sinFoto  = productos.filter(p => !tieneFoto(p) && !estaEliminado(p.id)).length;
  const conFoto  = productos.filter(p =>  tieneFoto(p) && !estaEliminado(p.id)).length;

  document.getElementById('stats').innerHTML =
    `Mostrando <strong>${lista.length}</strong> de <strong>${total}</strong> &nbsp;·&nbsp;` +
    `<span style="color:#ff6b6b">❌ Sin foto: <strong>${sinFoto}</strong></span> &nbsp;·&nbsp;` +
    `<span style="color:#6bff6b">✅ Con foto: <strong>${conFoto}</strong></span> &nbsp;·&nbsp;` +
    `<span style="color:#ffaa44">🗑 Eliminados: <strong>${nEli}</strong></span>`;

  if (!lista.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">No hay productos con ese criterio</div>';
    return;
  }

  document.getElementById('grid').innerHTML = lista.map(p => {
    const src  = getImgSrc(p);
    const pend = pending[p.id];
    const show = pend ? pend.dataUrl : src;
    const icon = CAT_ICON[p.categoria] || '📦';
    const eli  = estaEliminado(p.id);
    const hasFoto = tieneFoto(p);

    const imgHtml = show
      ? `<img src="${show}" alt="${p.nombre}" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="placeholder" style="display:none">${icon}</div>`
      : `<div class="placeholder">${icon}</div>`;

    const badge = eli
      ? `<span class="badge eli">🗑 eliminado</span>`
      : `<span class="badge ${hasFoto ? 'ok' : 'bad'}">${hasFoto ? '✓ foto' : 'sin foto'}</span>`;

    const cuerpo = eli ? `
      <p style="font-size:12px;color:#ffaa44;padding:8px 0">Oculto en el catálogo</p>
      <button class="btn-eliminar" style="background:#1a3a1a;color:#6bff6b;border-color:#205a20" onclick="restaurar(${p.id})">↩ Restaurar</button>
      ${p.custom ? `<button class="btn-eliminar" style="margin-top:5px;background:#1a0a0a;color:#ff4444;border-color:#5a1a1a" onclick="eliminarDefinitivo(${p.id})">🗑 Eliminar definitivo</button>` : ''}
    ` : `
      ${pend ? `<div class="preview-wrap"><img src="${pend.dataUrl}"><span>${pend.file.name}</span></div>` : ''}
      <div class="upload-zone" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="onDrop(event,${p.id})">
        <input type="file" accept="image/*" onchange="onFile(this,${p.id})">
        <div class="uz-icon">${pend ? '🖼️' : '📁'}</div>
        <div class="uz-text">${pend ? 'Lista para subir' : 'Clic o arrastra una foto'}</div>
      </div>
      <div class="progress-bar" id="pb-${p.id}"><div class="progress-fill" id="pf-${p.id}" style="width:0%"></div></div>
      <button class="btn-save ${pend ? 'show' : ''}" id="bs-${p.id}" onclick="guardarFoto(${p.id})"><span>💾 Guardar foto</span></button>
      <button class="btn-quitar ${getImgUrl(p.id) ? 'show' : ''}" onclick="quitarFoto(${p.id})">🗑 Quitar foto</button>
      <button class="btn-eliminar" onclick="eliminar(${p.id})">🗑 Eliminar del catálogo</button>
      ${p.custom ? `<button class="btn-eliminar" style="margin-top:5px;background:#1a0a0a;color:#ff4444;border-color:#5a1a1a" onclick="eliminarDefinitivo(${p.id})">🗑 Eliminar definitivo</button>` : ''}
    `;

    return `
      <div class="card ${eli ? 'eliminado' : (hasFoto ? '' : 'sin-foto')}" id="card-${p.id}">
        <div class="card-img">${imgHtml}${badge}</div>
        <div class="card-body">
          <div class="card-nombre" id="nom-${p.id}" onclick="editarNombre(${p.id})" title="Clic para editar">
            ${getNombre(p)} <span style="font-size:9px;color:#555">✏️</span>
          </div>
          <div class="card-sub">${p.marca} · ${p.presentacion}</div>
          ${cuerpo}
        </div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════════════════
// FOTO
// ══════════════════════════════════════════════════════════════════════════════
function onFile(input, id) { const f = input.files[0]; if (f) leer(f, id); }
function onDrop(e, id) {
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) leer(f, id);
}
function leer(file, id) {
  const r = new FileReader();
  r.onload = e => { pending[id] = { dataUrl: e.target.result, file }; render(); };
  r.readAsDataURL(file);
}

async function guardarFoto(id) {
  const pend = pending[id];
  if (!pend) return;
  const btn = document.getElementById(`bs-${id}`);
  const pb  = document.getElementById(`pb-${id}`);
  const pf  = document.getElementById(`pf-${id}`);
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div><span>Subiendo...</span>';
  pb.classList.add('show'); pf.style.width = '40%';
  const ext = pend.file.name.split('.').pop().toLowerCase() || 'jpg';
  const fileName = `img_${id}.${ext}`;
  try {
    const { error } = await sb.storage.from(BUCKET).upload(fileName, pend.file, { upsert: true, contentType: pend.file.type });
    if (error) throw error;
    pf.style.width = '100%';
    imgMap[id] = ext;
    delete pending[id];
    toast('✅ Foto guardada');
    setTimeout(() => { pb.classList.remove('show'); pf.style.width = '0%'; render(); }, 500);
  } catch(err) {
    btn.disabled = false; btn.innerHTML = '<span>💾 Guardar foto</span>'; pb.classList.remove('show');
    toast('❌ Error: ' + (err.message || err), true);
  }
}

async function quitarFoto(id) {
  if (!confirm('¿Quitar la foto de este producto?')) return;
  const ext = imgMap[id];
  if (ext) { await sb.storage.from(BUCKET).remove([`img_${id}.${ext}`]); delete imgMap[id]; }
  toast('🗑 Foto eliminada'); render();
}

// ══════════════════════════════════════════════════════════════════════════════
// NOMBRE
// ══════════════════════════════════════════════════════════════════════════════
function editarNombre(id) {
  const el = document.getElementById(`nom-${id}`);
  if (!el) return;
  const actual = getNombre(productos.find(p => p.id === id));
  el.outerHTML = `<input class="nombre-input" id="inp-${id}" value="${actual.replace(/"/g,'&quot;')}"
    onblur="guardarNombre(${id})" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){event.preventDefault();render();}">`;
  document.getElementById(`inp-${id}`)?.focus();
}

async function guardarNombre(id) {
  const input = document.getElementById(`inp-${id}`);
  if (!input) return;
  const nuevo = input.value.trim();
  const prod  = productos.find(p => p.id === id);
  if (!nuevo) { render(); return; }
  if (nuevo === prod.nombre) { delete nombresMap[id]; }
  else { nombresMap[id] = nuevo; }
  await guardarNombresDB();
  toast('✅ Nombre guardado');
  render();
}

// ══════════════════════════════════════════════════════════════════════════════
// ELIMINAR / RESTAURAR
// ══════════════════════════════════════════════════════════════════════════════
async function eliminar(id) {
  const prod = productos.find(p => p.id === id);
  if (!confirm(`¿Ocultar "${getNombre(prod)}" del catálogo?`)) return;
  if (!eliminados.includes(id)) eliminados.push(id);
  await guardarEliminadosDB();
  toast(`🗑 Producto oculto`); render();
}

async function restaurar(id) {
  eliminados = eliminados.filter(x => x !== id);
  await guardarEliminadosDB();
  toast('✅ Producto restaurado'); render();
}

// ══════════════════════════════════════════════════════════════════════════════
// AGREGAR PRODUCTO
// ══════════════════════════════════════════════════════════════════════════════
function abrirFormProducto() {
  // Categorías existentes
  const catSel = document.getElementById('np-categoria');
  catSel.innerHTML = '<option value="">Selecciona...</option>' +
    [...new Set(productos.map(p => p.categoria))].sort()
      .map(c => `<option value="${c}">${c}</option>`).join('');

  // Embalajes existentes
  const embSel = document.getElementById('np-embalaje');
  embSel.innerHTML = '<option value="">Selecciona...</option>' +
    [...new Set(productos.map(p => p.embalaje))].sort()
      .map(e => `<option value="${e}">${e}</option>`).join('');

  // Marcas (datalist)
  const marcas = [...new Set(productos.map(p => p.marca))].sort();
  document.getElementById('np-marcas-list').innerHTML =
    marcas.map(m => `<option value="${m}">`).join('');

  document.getElementById('form-producto').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('np-nombre').focus(), 100);
}

function cerrarFormProducto() {
  document.getElementById('form-producto').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('np-form').reset();
}

async function guardarProducto() {
  const nombre       = document.getElementById('np-nombre').value.trim();
  const marca        = document.getElementById('np-marca').value.trim();
  const categoria    = document.getElementById('np-categoria').value;
  const embalaje     = document.getElementById('np-embalaje').value;

  if (!nombre || !marca || !categoria || !embalaje) {
    toast('❌ Completa los campos obligatorios', true);
    return;
  }

  const btn = document.getElementById('np-btn-save');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Guardando...</span>';

  const prod = {
    id: nextCustomId,
    nombre,
    marca,
    categoria,
    embalaje,
    sabor:       document.getElementById('np-sabor').value.trim(),
    presentacion: document.getElementById('np-presentacion').value.trim(),
    volumen:     document.getElementById('np-volumen').value.trim(),
    unidades:    parseInt(document.getElementById('np-unidades').value) || 0,
    codigoBarra: document.getElementById('np-codigo').value.trim(),
    precio:      parseInt(document.getElementById('np-precio').value) || 0,
    peso:        parseFloat(document.getElementById('np-peso').value) || 0,
    imagen:      '',
    custom:      true
  };

  try {
    productosCustom.push(prod);
    productos.push(prod);
    nextCustomId++;
    await guardarProductosCustomDB();
    await guardarNextIdDB();
    cerrarFormProducto();
    toast('✅ Producto agregado');
    render();
  } catch(err) {
    toast('❌ Error al guardar: ' + (err.message || err), true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '💾 Guardar producto';
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// ELIMINAR DEFINITIVO (solo productos personalizados)
// ══════════════════════════════════════════════════════════════════════════════
async function eliminarDefinitivo(id) {
  const prod = productos.find(p => p.id === id);
  if (!prod || !prod.custom) return;
  if (!confirm(`¿Eliminar definitivamente "${getNombre(prod)}"?\nEsta acción no se puede deshacer.`)) return;
  // Quitar de productosCustom
  productosCustom = productosCustom.filter(p => p.id !== id);
  await guardarProductosCustomDB();
  // Quitar de eliminados si estaba oculto
  if (eliminados.includes(id)) {
    eliminados = eliminados.filter(x => x !== id);
    await guardarEliminadosDB();
  }
  // Quitar foto del bucket
  const ext = imgMap[id];
  if (ext) {
    try { await sb.storage.from(BUCKET).remove([`img_${id}.${ext}`]); } catch(e) {}
    delete imgMap[id];
  }
  // Quitar del array global
  const idx = productos.findIndex(p => p.id === id);
  if (idx !== -1) productos.splice(idx, 1);
  toast('🗑 Producto eliminado definitivamente');
  render();
}

// ══════════════════════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════════════════════
function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show${err ? ' error' : ''}`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ══════════════════════════════════════════════════════════════════════════════
// ARRANQUE
// ══════════════════════════════════════════════════════════════════════════════
const cats = [...new Set(productos.map(p => p.categoria))].sort();
const selCat = document.getElementById('filter-cat');
cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; selCat.appendChild(o); });

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-cat').addEventListener('change', render);

(async () => {
  await cargarTodo();
  // Re-poblar filtro de categorías incluyendo productos personalizados
  const allCats = [...new Set(productos.map(p => p.categoria))].sort();
  selCat.innerHTML = '<option value="">Todas las categorías</option>';
  allCats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; selCat.appendChild(o); });
  document.getElementById('loading').style.display = 'none';
  render();
})();
</script>
